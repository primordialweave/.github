name: Documentation improvement
description: Report missing, inaccurate, or unclear docs
title: "[Docs]: "
body:
  - type: input
    id: location
    attributes:
      label: Documentation path or URL
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should change?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording or example
